metadata:
  version: 1.0.0
  created: '2026-04-02'
  author: PAIML Engineering
  description: >
    LoRA target module selection — configurable subset of projection matrices
    to apply LoRA adapters. Standard QLoRA uses q_proj + v_proj (2 targets).
    All-linear uses all 7 projections (q/k/v/o/gate/up/down).
  references:
    - "Dettmers et al. (2023) QLoRA — default targets: q_proj, v_proj"
    - "Hu et al. (2021) LoRA — attention projections only"

equations:
  lora_contribution:
    formula: "h_proj = W_base @ x + scale * (x @ A) @ B"
    lean_theorem: Theorems.Lora_Contribution
    domain: "Only for projections in target_modules set"
    codomain: "h_proj ∈ ℝ^{seq × out_dim}"
    invariants:
      - "Non-target projections use base weights only (no LoRA)"
      - "Backward compute proportional to |target_modules|"

invariants:
  target_subset:
    statement: "target_modules ⊆ {q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj}"
    rationale: "Only valid transformer projection names"

  speed_proportional:
    statement: "backward_time(2_targets) ≈ backward_time(7_targets) * 2/7"
    rationale: "Fewer LoRA projections = fewer backward GEMMs"

  quality_preserved:
    statement: "loss(2_target, epoch_N) < loss(2_target, epoch_1)"
    rationale: "Training must converge regardless of target count"

falsification_tests:
  - id: FALSIFY-TARGET-001
    rule: speed_proportional
    prediction: "2-target training < 30 min for 99 samples × 3 epochs"
  - id: FALSIFY-TARGET-002
    rule: quality_preserved
    prediction: "Loss decreases across epochs with 2-target LoRA"
  - id: FALSIFY-TARGET-003
    rule: target_subset
    prediction: "Invalid target names rejected at construction time"
