# C-BNORM-001: Batched GPU Norm Reduction (KAIZEN-055)
#
# Splits squared_sum_cuda into launch + collect phases so callers can batch
# multiple reductions with a single stream.synchronize(). Fixes the 324
# pipeline flushes introduced by KAIZEN-054's per-block workspace clipping.

contract: C-BNORM-001
title: "Batched GPU Norm Reduction — Single Sync Per Block"
kaizen: KAIZEN-055
parent: C-WCLIP-001  # Fixes regression from KAIZEN-054
status: implemented
date: 2026-03-04

# Measured baseline (KAIZEN-054 state)
baseline:
  syncs_per_block: 9           # One stream.synchronize() per workspace buffer
  syncs_per_step_36_blocks: 324
  gpu_allocs_per_block: 9      # One GpuBuffer per squared_sum output

# After KAIZEN-055
target:
  syncs_per_block: 1           # Single sync after all 9 launches
  syncs_per_step_36_blocks: 36
  gpu_allocs_per_block: 9      # Still 9 tiny allocs (< 128 bytes each)

# API design
api:
  squared_sum_launch_cuda: |
    Launch kernel without synchronizing. Returns PendingSquaredSum handle.
    Caller MUST sync before calling squared_sum_collect.
  squared_sum_collect: |
    D2H download of partial sums + f64 accumulation + sqrt.
    Must be called after stream.synchronize().
  squared_sum_cuda: |
    Convenience wrapper: launch + sync + collect. Unchanged API.
    Used by non-batched callers (LM head, final norm weight).
  PendingSquaredSum: |
    Holds GpuBuffer<f32> of partial sums and num_blocks.
    Lightweight handle — output buffer freed on drop.

# Safety analysis
safety:
  sync_requirement: |
    PendingSquaredSum holds the output GpuBuffer. The kernel writes to this
    buffer asynchronously. Calling squared_sum_collect before sync would read
    stale/partial data. The sync requirement is documented and enforced by
    the batching pattern in compute_workspace_clip_scale_gpu.
  buffer_lifetime: |
    PendingSquaredSum owns the output GpuBuffer. It lives until squared_sum_collect
    returns. The Vec<PendingSquaredSum> in compute_workspace_clip_scale_gpu ensures
    all buffers survive until collection is complete.

# Preconditions
preconditions:
  - "squared_sum_launch_cuda: same as squared_sum_cuda (n > 0, input has n elements)"
  - "squared_sum_collect: stream.synchronize() must have been called after launch"

# Postconditions
postconditions:
  - "squared_sum_collect returns same value as squared_sum_cuda for same input"
  - "compute_workspace_clip_scale_gpu calls stream.synchronize() exactly once"

# Invariants
invariants:
  - "squared_sum_cuda unchanged — existing callers unaffected"
  - "PendingSquaredSum is not Clone/Copy — enforces single-use pattern"

# Files modified
files:
  - path: entrenar/src/autograd/cuda_optim.rs
    change: |
      - Added PendingSquaredSum struct
      - Added squared_sum_launch_cuda (kernel launch only)
      - Added squared_sum_collect (D2H + reduce)
      - Refactored squared_sum_cuda to call launch + sync + collect
  - path: entrenar/src/train/transformer_trainer/cuda_trainer.rs
    change: |
      - compute_workspace_clip_scale_gpu: launch 9 kernels, sync once, collect 9
      - Import squared_sum_launch_cuda, squared_sum_collect, PendingSquaredSum
