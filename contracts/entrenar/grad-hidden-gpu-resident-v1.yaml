# C-GRADHIDDEN-001: GPU-Resident grad_hidden in InstructPipeline Backward (KAIZEN-065)
#
# In cuda_train_step, the lm_head backward GEMM writes grad_hidden to
# grad_hidden_buf on GPU. Previously this was:
#   1. stream.synchronize() — full GPU drain point
#   2. trainer.download(&grad_hidden_buf) — D2H ~5MB
#   3. Vec truncation to seq_len * hidden_size — heap alloc ~5MB
#   4. backward_nf4_gpu_blocks(&grad_hidden, seq_len) — H2D ~5MB via copy_from_host_at
#
# The gradient makes a pointless GPU → CPU → GPU round-trip.
#
# Fix: backward_nf4_gpu_blocks_gpu_resident() reads grad_hidden_buf directly.
# Same CUDA stream guarantees GEMM output is complete before RMSNorm backward reads.

contract: C-GRADHIDDEN-001
title: "GPU-Resident grad_hidden in InstructPipeline Backward"
kaizen: KAIZEN-065
parent: C-CAUSALXENT-001
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-065)
baseline:
  grad_d2h_bytes: 5242880      # 512 * 2560 * 4 = ~5.0MB (Qwen3-4B, seq512)
  grad_h2d_bytes: 5242880      # same ~5.0MB re-uploaded via copy_from_host_at
  total_pcie_bytes: 10485760    # ~10MB round-trip per step
  sync_points: 1                # stream.synchronize() — full GPU drain
  heap_allocs: 1                # Vec<f32> ~5MB per step
  per_step_overhead_us: 1500    # ~1.5ms (sync + D2H + H2D + alloc)

# After KAIZEN-065
target:
  grad_d2h_bytes: 0             # grad_hidden stays GPU-resident
  grad_h2d_bytes: 0             # RMSNorm backward reads grad_hidden_buf directly
  total_pcie_bytes: 0            # Zero PCIe for gradient transfer
  sync_points: 0                 # No sync between GEMM and backward (same stream)
  heap_allocs: 0                 # No CPU Vec allocation
  per_step_savings_us: 1500      # ~1.5ms saved per step

# API design
api:
  backward_nf4_gpu_blocks_gpu_resident: |
    New method on InstructPipeline. Reads gradient directly from
    training_state.grad_hidden_buf (written by lm_head backward GEMM).
    Passes it to rms_norm_backward instead of grad_upload_buf.
    Called from cuda_train_step's GPU-resident path.
  backward_nf4_gpu_blocks_loop: |
    Extracted shared block-backward loop. Called by both CPU-upload
    path (backward_nf4_gpu_blocks) and GPU-resident path
    (backward_nf4_gpu_blocks_gpu_resident) after RMSNorm backward.
  backward_nf4_gpu_blocks: |
    Unchanged semantics — CPU fallback path. Uploads gradient from
    CPU slice to grad_upload_buf, runs RMSNorm backward, then calls
    backward_nf4_gpu_blocks_loop. Used by cuda_train_step_cpu_loss.

# Safety analysis
safety:
  stream_ordering: |
    gemm_forward and rms_norm_backward execute on the same CudaStream.
    CUDA stream semantics guarantee sequential execution: the GEMM
    output in grad_hidden_buf is complete before rms_norm_backward
    reads it. No explicit synchronization needed.
  buffer_aliasing: |
    grad_hidden_buf and grad_upload_buf are disjoint GPU buffers
    (separate fields of InstructGpuTrainingState). The GPU-resident
    path reads grad_hidden_buf; the CPU path writes grad_upload_buf.
    No aliasing.
  buffer_sizing: |
    Both buffers are allocated as trainer.zeros(buf_size) where
    buf_size = max_seq_len * hidden_size. Same dimensions.
    RMSNorm backward uses seq_len parameter (≤ max_seq_len) to
    bound access — trailing elements are irrelevant.
  fallback_path: |
    CPU fallback (cuda_train_step_cpu_loss) still calls
    backward_nf4_gpu_blocks which uploads from CPU. If the GPU
    GEMM fails, cuda_train_step returns loss without weight update.
  borrow_safety: |
    Upload + RMSNorm wrapped in scope block to release &mut borrows
    on training_state before calling backward_nf4_gpu_blocks_loop.
    Loop method re-borrows all fields independently.

# Preconditions
preconditions:
  - "gemm_forward completed on same stream (grad_hidden_buf populated)"
  - "grad_hidden_buf.len() >= seq_len * hidden_size"
  - "blocks_output contains forward pass output (for RMSNorm backward)"

# Postconditions
postconditions:
  - "Zero PCIe traffic for gradient transfer between GEMM and backward"
  - "Zero stream.synchronize() between GEMM and backward"
  - "Identical gradient values — same buffer, same data, no transform"
  - "CPU fallback path unchanged"

# Invariants
invariants:
  - "grad_hidden_buf contains GEMM output after lm_head backward"
  - "RMSNorm backward reads from grad_hidden_buf (GPU-resident) or grad_upload_buf (CPU path)"
  - "Block backward loop identical for both paths"

# Files modified
files:
  - path: entrenar/src/finetune/instruct_pipeline.rs
    change: |
      Added backward_nf4_gpu_blocks_gpu_resident (reads grad_hidden_buf directly).
      Extracted backward_nf4_gpu_blocks_loop (shared block-backward loop).
      Rewrote cuda_train_step step 3 to skip D2H download + sync.
      backward_nf4_gpu_blocks refactored to scope borrows + call loop.
