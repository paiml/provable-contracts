# C-CFWDSCRATCH-001: Pre-allocated Forward Ping-Pong Buffers in ClassifyPipeline (KAIZEN-060)
#
# forward_hidden_cuda_training allocated 2 GPU buffers per forward call:
#   - trainer.upload(hidden_slice) → cuMemAlloc + cuMemcpyHtoD
#   - trainer.zeros(seq_len * hidden) → vec![0.0; len] + cuMemAlloc + cuMemcpyHtoD
# Both dropped at function exit → 2 × cuMemFree per forward pass.
#
# For SSC training (14K samples): 28K cuMemAlloc + 28K cuMemFree per epoch.
# Each cuMemAlloc costs ~10-100µs → 2.8-28s wasted per epoch on CUDA driver overhead.
#
# Fix: Add fwd_scratch_a/b to GpuTrainingState, pre-allocated once at init.
# Same pattern as KAIZEN-053 in cuda_trainer.rs.

contract: C-CFWDSCRATCH-001
title: "Pre-allocated Forward Ping-Pong Buffers in ClassifyPipeline"
kaizen: KAIZEN-060
parent: C-GPUTRAINIT-002  # GPU training init contract
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-060)
baseline:
  cuMemAlloc_per_forward: 2  # upload + zeros
  cuMemFree_per_forward: 2  # both dropped at function exit
  cpu_alloc_per_forward: 1  # vec![0.0; len] in trainer.zeros()
  per_forward_overhead_us: 20  # ~10µs per cuMemAlloc (conservative)
  per_epoch_overhead_s: 0.56  # 14K samples × 2 × 20µs

# After KAIZEN-060
target:
  cuMemAlloc_per_forward: 0  # All buffers pre-allocated
  cuMemFree_per_forward: 0  # No per-call GPU deallocations
  cpu_alloc_per_forward: 0  # No CPU vec allocation
  per_forward_overhead_us: 0  # Zero CUDA driver overhead per forward
  one_time_cost_bytes: 2621440  # 2 × max_seq_len × hidden_size × 4 (2 × 1.3MB for seq=128, h=2560)

# API design
api:
  fwd_scratch_a_b: |
    New fields on GpuTrainingState: fwd_scratch_a, fwd_scratch_b.
    Both GpuBuffer<f32> sized to max_seq_len * hidden_size.
    Allocated once during GpuTrainingState::init_training_state().
  forward_hidden_cuda_training: |
    Rewritten to use pre-allocated ping-pong buffers.
    Upload via copy_from_host_at (partial write into pre-allocated buffer).
    Ping-pong via raw pointers (same pattern as cuda_trainer.rs KAIZEN-053).

# Safety analysis
safety:
  buffer_sizing: |
    fwd_scratch_a/b are max_seq_len * hidden_size — sufficient for any seq_len <= max_seq_len.
    copy_from_host_at writes only seq_len * hidden_size elements at offset 0.
    Remaining buffer contents are irrelevant (kernels use seq_len parameter).
  ping_pong_safety: |
    Raw pointers used for disjoint field access (same pattern as cuda_trainer.rs).
    scratch_a_ptr and scratch_b_ptr point to different struct fields.
    Only one is written per iteration; the other is read-only.

# Preconditions
preconditions:
  - "GpuTrainingState initialized (fwd_scratch_a/b allocated)"
  - "token_ids.len() <= max_seq_len"

# Postconditions
postconditions:
  - "Forward pass behavior identical — same GEMM, same activations, same output"
  - "Zero per-call GPU memory allocations during forward pass"

# Invariants
invariants:
  - "fwd_scratch_a/b never reallocated after construction"
  - "Inference-only path unchanged (no GpuTrainingState)"

# Files modified
files:
  - path: entrenar/src/finetune/classify_pipeline.rs
    change: "Added fwd_scratch_a/b to GpuTrainingState, rewrote forward_hidden_cuda_training"
