# Binding Registry: provable-contracts <-> entrenar
#
# Maps each training contract equation/invariant to the entrenar function
# that implements it. Used by `pv audit --binding` and `pv probar --binding`.
#
# Statistics:
#   Total bindings: 88
#   Implemented: 80 (90.9%)
#   Partial: 3
#   Not implemented: 5
#
# Refs: paiml/entrenar#250, paiml/provable-contracts#11

