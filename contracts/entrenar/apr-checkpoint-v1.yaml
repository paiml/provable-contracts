# APR Checkpoint Contract v1.0.0
# THE SOURCE OF TRUTH for APR checkpoint save/load/resume
#
# STATUS: Draft
# SPEC: aprender/docs/specifications/apr-checkpoints.md v1.2.0
# TICKET: SSC-030 (v3 Binary Training Run)
# CONSUMERS:
#   - entrenar/src/finetune/classify_trainer.rs (save_checkpoint, save_apr_checkpoint)
#   - aprender/src/serialization/apr/mod.rs (AprWriter, AprReader)
#   - aprender/src/format/v2/writer.rs (AprV2Writer)
#   - aprender/crates/apr-cli/src/commands/train.rs (--resume flag)
#
# ENFORCEMENT: Runtime assertions + falsification tests.

metadata:
  version: "1.0.0"
  created: "2026-03-01"
  author: "PAIML Engineering"
  description: "APR checkpoint format for training save/resume and adapter deployment"
  references:
    - "aprender/docs/specifications/apr-checkpoints.md v1.2.0"
    - "aprender/docs/specifications/APR-SPEC.md v2.1.0 (binary format)"
    - "training-loop-v1.yaml (F-LOOP-003: checkpoint restorable)"
    - "cuda-classify-training-v1.yaml (F-CUDA-004: weight fidelity)"
  depends_on:
    - "training-loop-v1"
    - "qwen2-weight-loading-v1"

# =============================================================================
# FILE EXTENSION INVARIANTS
# =============================================================================

file_extensions:
  - extension: ".apr"
    type: "base_model"
    description: "Full transformer weights for inference"

  - extension: ".adapter.apr"
    type: "adapter"
    description: "LoRA adapters + task head, no optimizer state"

  - extension: ".ckpt.apr"
    type: "training_checkpoint"
    description: "LoRA + task head + optimizer state, for resume"

# =============================================================================
# ADAPTER CHECKPOINT INVARIANTS (.adapter.apr)
# =============================================================================

adapter_checkpoint:
  - id: F-CKPT-001
    name: "Adapter completeness"
    description: |
      An .adapter.apr file MUST contain ALL trainable parameters:
        - Every lora_a and lora_b tensor for every LoRA adapter
        - classifier.weight and classifier.bias (or equivalent task head)
        - Adapter config in metadata (rank, alpha, target_modules)
      count(lora tensors) == 2 * num_layers * num_target_modules
    severity: P0
    critical: true
    applies_to: ".adapter.apr"

  - id: F-CKPT-002
    name: "Schema version present"
    description: |
      Every .adapter.apr and .ckpt.apr MUST contain:
        __checkpoint__.schema_version: <integer>
        __checkpoint__.type: "adapter" | "training"
      Readers MUST reject files where schema_version > SUPPORTED_VERSION.
    severity: P0
    critical: true
    applies_to: [".adapter.apr", ".ckpt.apr"]

  - id: F-CKPT-003
    name: "No training state in adapter"
    description: |
      An .adapter.apr file MUST NOT contain any __training__.* tensors.
      Adapter checkpoints are for deployment, not resume.
    severity: P1
    critical: false
    applies_to: ".adapter.apr"

# =============================================================================
# TRAINING CHECKPOINT INVARIANTS (.ckpt.apr)
# =============================================================================

training_checkpoint:
  - id: F-CKPT-004
    name: "Training state completeness"
    description: |
      A .ckpt.apr file MUST contain sufficient state to resume training:
        - All model tensors (F-CKPT-001)
        - Optimizer moment tensors for every trainable parameter:
          __training__.optim.{name}.exp_avg    (first moment)
          __training__.optim.{name}.exp_avg_sq (second moment)
        - Epoch, step, scheduler state in metadata
      count(optim tensors) == 2 * count(model trainable tensors)
    severity: P0
    critical: true
    applies_to: ".ckpt.apr"

  - id: F-CKPT-005
    name: "Resume produces equivalent training"
    description: |
      Training from epoch N via resume MUST produce val_loss within 0.05
      of continuous training at epoch N+1. This verifies optimizer state,
      LR schedule, and data shuffling are all correctly restored.
      Strengthens F-LOOP-003 from training-loop-v1.yaml.
    severity: P0
    critical: true
    tolerance: 0.05
    applies_to: ".ckpt.apr"

  - id: F-CKPT-006
    name: "Data hash verification on resume"
    description: |
      When resuming from .ckpt.apr, the trainer MUST compute SHA-256 of the
      training data file and compare to __training__.data.data_hash.
      Mismatch is a hard error by default.
      --allow-data-mismatch flag overrides with warning.
    severity: P1
    critical: false
    applies_to: ".ckpt.apr"

# =============================================================================
# WRITE-SIDE INTEGRITY (preventing corrupted checkpoints)
# =============================================================================

write_integrity:
  - id: F-CKPT-007
    name: "No NaN/Inf in saved tensors"
    description: |
      Before writing ANY tensor (model or optimizer), the writer MUST scan
      for NaN and Inf values. If ANY are found:
        - Adapter checkpoints (.adapter.apr): HARD ERROR, refuse to write.
        - Training checkpoints (.ckpt.apr): HARD ERROR, refuse to write.
      This catches gradient explosions, numerical instability, and memory
      corruption BEFORE they are persisted to disk.
      Applies to BOTH APR and SafeTensors writes.
    severity: P0
    critical: true
    applies_to: [".adapter.apr", ".ckpt.apr"]

  - id: F-CKPT-008
    name: "Tensor shape matches architecture config"
    description: |
      Before writing, verify every tensor's shape against the model config:
        - classifier.weight: [num_classes, hidden_size]
        - classifier.bias: [num_classes]
        - lora.N.*.lora_a: [rank, d_in]
        - lora.N.*.lora_b: [d_out, rank]
        - __training__.optim.{name}.exp_avg: same shape as {name}
        - __training__.optim.{name}.exp_avg_sq: same shape as {name}
      Shape mismatch is a HARD ERROR. This prevents saving a checkpoint
      whose tensors don't match the architecture that produced them.
    severity: P0
    critical: true
    applies_to: [".adapter.apr", ".ckpt.apr"]

  - id: F-CKPT-009
    name: "Atomic write (crash-safe)"
    description: |
      Checkpoint writes MUST be atomic: write to a temp file, then rename.
      If the process crashes mid-write, the previous checkpoint is intact.
        1. Write to {path}.tmp
        2. fsync the file
        3. rename {path}.tmp → {path}
      A partially-written .apr file MUST NEVER replace a valid one.
      SafeTensors writes follow the same pattern.
    severity: P0
    critical: true

  - id: F-CKPT-010
    name: "Dtype consistency"
    description: |
      All model tensors (lora.*, classifier.*) MUST be saved as F32.
      All optimizer tensors (__training__.optim.*) MUST be saved as F32
      (unless --checkpoint-precision f16 is explicitly set).
      A checkpoint MUST NOT mix dtypes silently.
    severity: P1
    critical: false

# =============================================================================
# READ-SIDE INTEGRITY (detecting corrupted checkpoints)
# =============================================================================

read_integrity:
  - id: F-CKPT-011
    name: "CRC32 verification on APR load"
    description: |
      AprReader MUST verify BOTH header CRC32 and footer CRC32 on every
      open(). If either checksum fails, return an error:
        "APR file corrupted: CRC32 mismatch (header|footer)"
      This detects bit flips, truncation, and tampering.
      This is APR's advantage over SafeTensors (which has NO checksums).
    severity: P0
    critical: true
    applies_to: ".apr"

  - id: F-CKPT-012
    name: "SafeTensors header validation"
    description: |
      When loading SafeTensors, the reader MUST validate:
        1. Header length (first 8 bytes) does not exceed file size
        2. Header JSON parses successfully
        3. Every tensor's data_offsets [start, end) falls within file bounds
        4. No tensor data_offsets overlap
        5. Every tensor's byte count matches dtype * product(shape)
      Failure on ANY check is a hard error. This compensates for SafeTensors
      having no checksum — we validate structural integrity instead.
    severity: P0
    critical: true
    applies_to: "safetensors"

  - id: F-CKPT-013
    name: "Post-load NaN/Inf scan"
    description: |
      After loading tensors from ANY format (APR or SafeTensors), the reader
      MUST scan model tensors (lora.*, classifier.*) for NaN/Inf.
      If found: hard error, refuse to use the checkpoint.
      Optimizer tensors (__training__.optim.*) are also scanned on resume.
      This catches on-disk corruption that passed CRC32 (e.g., the bit flip
      happened to produce a valid CRC32 by coincidence — astronomically rare
      but not impossible for large files).
    severity: P0
    critical: true

  - id: F-CKPT-014
    name: "Shape validation against loaded config"
    description: |
      After loading a checkpoint, the reader MUST verify that every tensor's
      shape matches the architecture config stored in the same file's metadata.
      Example: if metadata says hidden_size=896 and num_classes=2, then
      classifier.weight MUST have shape [2, 896].
      Mismatch is a hard error:
        "Tensor classifier.weight shape [2, 512] does not match config (hidden_size=896)"
    severity: P0
    critical: true

# =============================================================================
# FORMAT INVARIANTS (all APR checkpoint types)
# =============================================================================

format_invariants:
  - id: F-CKPT-015
    name: "Canonical tensor ordering"
    description: |
      AprV2Writer MUST sort tensor index entries lexicographically by name
      before writing. This ensures save(load(file)) == file (bit-identical).
    severity: P1
    critical: false

  - id: F-CKPT-016
    name: "Backward compatibility"
    description: |
      An inference-only reader (realizar) MUST successfully load .ckpt.apr
      files by skipping all __training__.* tensors. The remaining tensors
      form a valid inference checkpoint.
    severity: P1
    critical: false

  - id: F-CKPT-017
    name: "Provenance hash integrity"
    description: |
      base_model_hash uses the canonical hash algorithm:
        1. Sort tensor names lexicographically
        2. For each: name_utf8 || 0x00 || dtype_byte || shape_le_u64s || data_bytes
        3. SHA-256 the concatenated stream
      This hash is format-independent (same for SafeTensors, GGUF, APR).
    severity: P2
    critical: false

  - id: F-CKPT-018
    name: "SafeTensors round-trip"
    description: |
      import(export(import(hf_dir))) == import(hf_dir) for tensor data.
      Tensor name mapping between HF PEFT convention and APR convention
      is bijective (no collisions, no data loss).
    severity: P2
    critical: false

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification_tests:
  - id: FALSIFY-CKPT-001
    rule: "F-CKPT-001 Adapter completeness"
    prediction: "Adapter checkpoint contains all LoRA + classifier tensors"
    test: |
      #[test]
      fn test_falsify_ckpt_001_adapter_completeness() {
          // Train for 1 epoch, save adapter checkpoint
          let trainer = setup_test_trainer(num_classes=2, lora_rank=4);
          trainer.train_one_epoch();
          let adapter_path = tmp_dir.join("test.adapter.apr");
          trainer.save_adapter_checkpoint(&adapter_path);

          // Verify all tensors present
          let reader = AprReader::open(&adapter_path).unwrap();
          let names: Vec<&str> = reader.tensors.iter().map(|t| t.name.as_str()).collect();

          // Must have classifier
          assert!(names.contains(&"classifier.weight"));
          assert!(names.contains(&"classifier.bias"));

          // Must have all LoRA adapters (2 per layer * num_layers)
          let lora_count = names.iter().filter(|n| n.starts_with("lora.")).count();
          let expected = 2 * num_layers * 2; // 2 tensors (a,b) * layers * targets (q,v)
          assert_eq!(lora_count, expected);

          // Must NOT have training tensors
          assert!(names.iter().all(|n| !n.starts_with("__training__")));
      }
    if_fails: "save_apr_checkpoint missing LoRA weights or leaking training state"

  - id: FALSIFY-CKPT-002
    rule: "F-CKPT-004 Training state completeness"
    prediction: "Training checkpoint has optimizer moments for every param"
    test: |
      #[test]
      fn test_falsify_ckpt_002_training_completeness() {
          let trainer = setup_test_trainer(num_classes=2, lora_rank=4);
          trainer.train_one_epoch();
          let ckpt_path = tmp_dir.join("test.ckpt.apr");
          trainer.save_training_checkpoint(&ckpt_path);

          let reader = AprReader::open(&ckpt_path).unwrap();
          let names: Vec<&str> = reader.tensors.iter().map(|t| t.name.as_str()).collect();

          // Count model vs optimizer tensors
          let model_tensors: Vec<_> = names.iter()
              .filter(|n| !n.starts_with("__training__"))
              .collect();
          let optim_tensors: Vec<_> = names.iter()
              .filter(|n| n.starts_with("__training__.optim."))
              .collect();

          // Optimizer: 2 tensors (exp_avg, exp_avg_sq) per model tensor
          assert_eq!(optim_tensors.len(), 2 * model_tensors.len());
      }
    if_fails: "Training checkpoint missing optimizer state for some parameters"

  - id: FALSIFY-CKPT-003
    rule: "F-CKPT-005 Resume equivalence"
    prediction: "Resumed training matches continuous training"
    test: |
      #[test]
      fn test_falsify_ckpt_003_resume_equivalence() {
          // Train continuously for 3 epochs
          let trainer_a = setup_test_trainer(seed=42);
          trainer_a.train(epochs=3);
          let continuous_loss = trainer_a.last_val_loss();

          // Train 1 epoch, checkpoint, resume for 2 more
          let trainer_b = setup_test_trainer(seed=42);
          trainer_b.train(epochs=1);
          trainer_b.save_training_checkpoint(&ckpt_path);

          let trainer_c = ClassifyTrainer::from_checkpoint(&ckpt_path);
          trainer_c.train(epochs=2); // resumes from epoch 1
          let resumed_loss = trainer_c.last_val_loss();

          // Must be within tolerance
          assert!((continuous_loss - resumed_loss).abs() < 0.05,
              "Continuous: {continuous_loss}, Resumed: {resumed_loss}");
      }
    if_fails: "Resume not restoring optimizer/scheduler state correctly"

  - id: FALSIFY-CKPT-004
    rule: "F-CKPT-015 Canonical ordering"
    prediction: "save(load(file)) == file (bit-identical)"
    test: |
      #[test]
      fn test_falsify_ckpt_004_canonical_ordering() {
          let trainer = setup_test_trainer();
          trainer.train_one_epoch();
          let path_a = tmp_dir.join("a.adapter.apr");
          trainer.save_adapter_checkpoint(&path_a);

          // Round-trip: load then save
          let reader = AprReader::open(&path_a).unwrap();
          let path_b = tmp_dir.join("b.adapter.apr");
          // ... reconstruct writer from reader, write to path_b

          let bytes_a = std::fs::read(&path_a).unwrap();
          let bytes_b = std::fs::read(&path_b).unwrap();
          assert_eq!(bytes_a, bytes_b, "Round-trip not bit-identical");
      }
    if_fails: "AprV2Writer not sorting tensors by name"

  - id: FALSIFY-CKPT-005
    rule: "F-CKPT-016 Backward compatibility"
    prediction: "Inference reader loads .ckpt.apr without error"
    test: |
      #[test]
      fn test_falsify_ckpt_005_backward_compat() {
          let trainer = setup_test_trainer();
          trainer.train_one_epoch();
          let ckpt_path = tmp_dir.join("test.ckpt.apr");
          trainer.save_training_checkpoint(&ckpt_path);

          // Inference reader must load without error
          let reader = AprReader::open(&ckpt_path).unwrap();

          // Must be able to read model tensors
          let weight = reader.read_tensor_f32("classifier.weight").unwrap();
          assert!(!weight.is_empty());

          // Training tensors exist but should be skippable
          let has_training = reader.tensors.iter()
              .any(|t| t.name.starts_with("__training__"));
          assert!(has_training, "Test setup: ckpt should have training tensors");
      }
    if_fails: "AprReader crashes on __training__.* tensors"

# =============================================================================
# TOYOTA WAY PRINCIPLES
# =============================================================================

toyota_way_principles:
  jidoka: |
    Training halts on checkpoint write failure (no silent data loss).
    Resume halts on schema_version mismatch or data_hash mismatch.
    Andon cord: any F-CKPT P0 failure stops the training pipeline.
  poka_yoke: |
    File extensions (.apr, .adapter.apr, .ckpt.apr) prevent misuse.
    __checkpoint__.type metadata is authoritative — extension is a hint.
    Optimizer tensors namespaced with __training__ prefix — impossible to
    confuse with model weights.
  genchi_genbutsu: |
    Falsification tests use real training (forward + backward passes) on
    separable synthetic data, not mocks.
  kaizen: |
    Schema version enables forward-compatible evolution.
    Canonical hash algorithm enables cross-format verification.

# =============================================================================
# QA GATE
# =============================================================================

qa_gate:
  description: "APR checkpoint quality gate"
  requirements:
    - "All 5 falsification tests pass"
    - "F-CKPT-001 and F-CKPT-004 verified on every checkpoint write"
    - "F-CKPT-005 verified before any resumed training starts"
    - "No unwrap() in checkpoint save/load paths"
