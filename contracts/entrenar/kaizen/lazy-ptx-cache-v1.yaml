# C-LPTX-001: Lazy PTX Generation for Cached Kernel Modules (KAIZEN-058)
#
# After pre-warm, all CUDA kernel modules are already JIT-compiled and cached.
# Previously, every kernel launch function regenerated the full PTX string
# (multi-KB) and created format! key strings BEFORE checking the cache.
# With ~1000+ kernel launches per training step, this caused ~1000 wasted
# multi-KB String allocations per step.
#
# Fix: Add get_cached() to all 3 kernel caches. Each launch function now
# checks the cache first (cheap HashMap lookup), only generating PTX on miss.

contract: C-LPTX-001
title: "Lazy PTX Generation for Cached Kernel Modules"
kaizen: KAIZEN-058
parent: C-PREWARM-001  # Pre-warm guarantees all modules are cached
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-058)
baseline:
  ptx_generations_per_step: 1000+  # Every kernel launch regenerates PTX
  ptx_string_size_avg_bytes: 2048  # 500B (simple) to 4KB (GEMM) average ~2KB
  wasted_alloc_per_step_bytes: 2097152  # ~2MB of String allocations dropped immediately
  cache_hit_rate: 100%  # After pre-warm, all lookups hit cache

# After KAIZEN-058
target:
  ptx_generations_per_step: 0  # Zero after pre-warm (all cache hits)
  ptx_string_size_avg_bytes: 0  # No PTX generated on cache hit
  wasted_alloc_per_step_bytes: 0  # Only format! key strings (~30B each)
  cache_hit_rate: 100%  # Same — pre-warm covers all shapes

# API design
api:
  get_cached: |
    New method on ForwardKernelCache, KernelCache, and OptimKernelCache.
    Returns Option<&mut CudaModule> from HashMap lookup.
    No PTX generation, no target validation — pure HashMap::get_mut.
  get_or_compile: |
    Unchanged — still available for cold-path (pre-warm, first-time compilation).
    Now only called on cache miss (None from get_cached).

# Safety analysis
safety:
  cache_consistency: |
    get_cached returns a module that was previously compiled by get_or_compile.
    The module's PTX was target-validated at compilation time (F-PTX-001).
    No risk of target mismatch since the module was already validated.
  cold_start: |
    If get_cached returns None (pre-warm missed a shape), the function
    falls back to the original get_or_compile path. Zero behavioral change.
  pre_warm_guarantee: |
    C-PREWARM-001 pre-warms all shapes used during training.
    get_cached should always hit. If it misses, get_or_compile handles it.

# Preconditions
preconditions:
  - "Kernel cache initialized (init_*_kernel_cache called)"
  - "Pre-warm completed for model dimensions (C-PREWARM-001)"

# Postconditions
postconditions:
  - "Kernel launch behavior identical — same module, same kernel, same config"
  - "Zero PTX String allocations on cache hit path"
  - "Cold-start path (cache miss) works identically to pre-KAIZEN-058"

# Invariants
invariants:
  - "get_or_compile unchanged — existing callers unaffected"
  - "Pre-warm functions unchanged — still use get_or_compile to populate cache"
  - "34 kernel launch functions updated — all use get_cached-first pattern"

