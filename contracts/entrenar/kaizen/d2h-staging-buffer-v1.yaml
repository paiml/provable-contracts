# C-D2HSTG-001: Pre-allocated D2H Staging Buffer for Gradient Accumulation (KAIZEN-059)
#
# During gradient accumulation (accumulation_steps > 1), per-block gradient downloads
# and LM head/norm gradient downloads each allocated a temporary Vec<f32> per call.
# For Qwen3-4B (36 layers, vocab=151936, hidden=2560, intermediate=6912):
#   - download_workspace_to_accum: 36 calls/micro-batch × vec![0.0; h*i] ≈ 2.4 GB/micro-batch
#   - download_nonblock_grads_to_accum: 1 call/micro-batch × vec![0.0; vocab*h] ≈ 1.5 GB/micro-batch
#   - With accumulation_steps=4: ~15.6 GB wasted heap allocations per training step
#
# Fix: Add persistent d2h_staging field to CudaTransformerTrainer, sized once at
# construction to max(h*intermediate, vocab*h). Passed into both download functions.

contract: C-D2HSTG-001
title: "Pre-allocated D2H Staging Buffer for Gradient Accumulation Downloads"
kaizen: KAIZEN-059
parent: C-GPUTRAIN-002  # GPU training transfer budget
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-059)
baseline:
  workspace_downloads_per_microbatch: 36  # One per transformer block
  workspace_alloc_per_call_bytes: 27262976  # h*i*4 = 2560*6912*4 (Qwen3-4B gate/up/down)
  nonblock_alloc_per_call_bytes: 1555824640  # vocab*h*4 = 151936*2560*4
  total_heap_churn_per_step_bytes: 16106127360  # ~15 GB with accumulation_steps=4
  allocations_per_step: 148  # (36+1) * 4 micro-batches

# After KAIZEN-059
target:
  workspace_downloads_per_microbatch: 36  # Unchanged — still 36 D2H copies
  workspace_alloc_per_call_bytes: 0  # Uses pre-allocated staging buffer
  nonblock_alloc_per_call_bytes: 0  # Uses same pre-allocated staging buffer
  total_heap_churn_per_step_bytes: 0  # Zero per-step allocations
  allocations_per_step: 0  # All downloads use persistent staging buffer
  staging_buffer_bytes: 1555824640  # One-time allocation: max(h*i, vocab*h) * 4

# API design
api:
  d2h_staging_field: |
    New `d2h_staging: Vec<f32>` field on CudaTransformerTrainer.
    Allocated once in constructor when accumulation_steps > 1.
    Sized to max(hidden*intermediate, vocab*hidden) — covers all D2H needs.
    Empty Vec when accumulation is disabled (zero cost).
  download_workspace_to_accum: |
    Added `host: &mut [f32]` parameter. Callers pass &mut self.d2h_staging.
    No longer allocates vec![0.0; max_len] per call.
    copy_to_host_at fully overwrites the slice — no zeroing needed.
  download_nonblock_grads_to_accum: |
    Added `host: &mut [f32]` parameter. Callers pass &mut self.d2h_staging.
    No longer allocates vec![0.0; max_len] per call.

# Safety analysis
safety:
  buffer_size: |
    d2h_staging is sized to max(h*intermediate, vocab*hidden) at construction.
    This covers the largest possible D2H download (LM head gradient).
    All workspace buffers are strictly smaller (h*i < vocab*h for any real model).
  no_zeroing_needed: |
    copy_to_host_at fully overwrites the destination slice.
    The pre-existing buffer contents are irrelevant — they're replaced before use.
    The accumulate loop only reads from the freshly-written slice region.
  split_borrows: |
    d2h_staging is a separate struct field from grad_accum, cuda_grad_workspace,
    lm_head_grad_gpu, and gpu_training. Rust split-borrow rules allow simultaneous
    mutable access to different fields without &mut self conflicts.
  conditional_allocation: |
    When accumulation_steps == 1, d2h_staging is Vec::new() (0 bytes).
    download_workspace_to_accum and download_nonblock_grads_to_accum are never
    called in the non-accumulating path, so the empty buffer is safe.

# Preconditions
preconditions:
  - "CudaTransformerTrainer initialized (d2h_staging allocated)"
  - "accumulation_steps > 1 (otherwise downloads never called)"
  - "stream.synchronize() called before D2H copy (ALB-065 / Rule 6)"

# Postconditions
postconditions:
  - "Gradient accumulation behavior identical — same values, same D2H copies"
  - "Zero per-call heap allocations in both download functions"
  - "One-time staging buffer allocation at construction only"

# Invariants
invariants:
  - "d2h_staging.len() >= max workspace buffer length"
  - "d2h_staging.len() >= vocab_size * hidden_size"
  - "Non-accumulating path unchanged (d2h_staging never accessed)"
  - "Follows KAIZEN-056 pattern (h2d_staging for H2D, d2h_staging for D2H)"

# Files modified
files:
  - path: entrenar/src/train/transformer_trainer/cuda_trainer.rs
    change: "Added d2h_staging field, allocated in constructor, passed to both download functions"
