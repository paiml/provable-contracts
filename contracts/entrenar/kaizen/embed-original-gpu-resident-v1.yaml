# C-EMBEDGPU-001: GPU-Resident Non-Transposed Embed in InstructPipeline (KAIZEN-068)
#
# In cuda_train_step, the lm_head backward GEMM requires the non-transposed
# embedding matrix [vocab, hidden]. Previously this was:
#   1. trainer.upload(embed_slice) — ~1.45GB H2D per step (Qwen3-4B: 151936 × 2560 × 4)
#   2. cuMemAlloc for temporary GpuBuffer (~1.45GB)
#   3. cuMemFree when GpuBuffer drops at end of scope
#
# The transposed embed [hidden, vocab] was already GPU-resident for forward GEMM,
# but the original layout was re-uploaded from CPU every single training step.
#
# Fix: Upload embed_original once during try_init_gpu_training. Both backward
# paths (cuda_train_step and cuda_train_step_cpu_loss) read it directly.

contract: C-EMBEDGPU-001
title: "GPU-Resident Non-Transposed Embed in InstructPipeline"
kaizen: KAIZEN-068
parent: C-GRADHIDDEN-001
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-068)
baseline:
  embed_h2d_bytes_per_step: 1555783680   # 151936 × 2560 × 4 = ~1.45GB
  cuMemAlloc_per_step: 1                  # 1× cuMemAlloc for temporary GpuBuffer
  cuMemFree_per_step: 1                   # 1× cuMemFree when temporary drops
  per_step_overhead_us: 58000             # ~58ms at PCIe Gen4 x16 (~25 GB/s)

# After KAIZEN-068
target:
  embed_h2d_bytes_per_step: 0             # embed_original is GPU-resident
  cuMemAlloc_per_step: 0                  # No temporary allocation needed
  cuMemFree_per_step: 0                   # No temporary deallocation
  per_step_savings_us: 58000              # ~58ms saved per step
  additional_vram_bytes: 1555783680       # ~1.45GB additional (embed stored in both layouts)

# VRAM budget analysis (RTX 4090, 24GB)
vram_analysis:
  nf4_model_weights: 1300000000           # ~1.3GB (36 layers × ~36MB NF4)
  lora_adapters: 5900000                  # ~5.9MB (72 adapters, rank-16)
  training_state_buffers: 256000000       # ~256MB (13 scratch buffers × ~5MB)
  layer_inputs: 188000000                 # ~188MB (36 × 5.2MB)
  logits_buf: 311296000                   # ~296MB (512 × 151936 × 4)
  embed_transposed: 1555783680            # ~1.45GB [hidden, vocab]
  embed_original: 1555783680              # ~1.45GB [vocab, hidden] — NEW
  total_estimated: 5172763360             # ~4.82GB
  available_vram: 25769803776             # 24GB
  headroom_pct: 81.3                      # ~81% headroom remaining

# API design
api:
  embed_original: |
    New field on InstructGpuTrainingState. GpuBuffer<f32> of size vocab_size × hidden_size,
    uploaded once from model.embed_tokens.weight during try_init_gpu_training.
  cuda_train_step: |
    Uses training.embed_original instead of trainer.upload(embed_slice).
    Eliminates per-step CPU→GPU transfer of ~1.45GB.
  cuda_train_step_cpu_loss: |
    Same change — uses training.embed_original instead of per-step upload.

# Safety analysis
safety:
  buffer_sizing: |
    embed_original allocated via trainer.upload(embed_slice) where embed_slice
    has vocab_size × hidden_size elements. Same dimensions as the per-step upload
    it replaces. GEMM reads seq_len × vocab_size from logits_buf, multiplies by
    embed_original [vocab_size × hidden_size], writes seq_len × hidden_size to
    grad_hidden_buf. seq_len ≤ max_seq_len — all within bounds.
  data_freshness: |
    Embedding weights are frozen during NF4 QLoRA training (only LoRA adapters
    are trainable). The embed_original buffer never needs updating after init.
    This is safe because NF4 training does not modify base model weights.
  buffer_aliasing: |
    embed_original and embed_transposed are disjoint GPU buffers — different
    data layouts, allocated separately. No aliasing possible.
  backward_compatibility: |
    cuda_train_step_cpu_loss fallback path also uses embed_original, so the
    CPU loss path gets the same speedup. No functional change.

# Preconditions
preconditions:
  - "model.embed_tokens.weight is contiguous and has vocab_size × hidden_size elements"
  - "CUDA device has sufficient VRAM for both embed layouts (~2.9GB for Qwen3-4B)"

# Postconditions
postconditions:
  - "Zero PCIe traffic for embed transfer during training step"
  - "embed_original contains same data as model.embed_tokens.weight (uploaded once at init)"
  - "lm_head backward GEMM uses GPU-resident embed_original"

# Invariants
invariants:
  - "embed_original data is immutable during training (frozen base weights)"
  - "embed_transposed and embed_original represent same matrix in different layouts"
  - "Both backward paths (GPU-resident and CPU-loss) use embed_original"

# Files modified
files:
  - path: entrenar/src/finetune/instruct_pipeline.rs
    change: |
      Added embed_original field to InstructGpuTrainingState.
      try_init_gpu_training: uploads embed_original alongside embed_transposed.
      cuda_train_step: uses training.embed_original (no per-step upload).
      cuda_train_step_cpu_loss: uses training.embed_original (no per-step upload).
