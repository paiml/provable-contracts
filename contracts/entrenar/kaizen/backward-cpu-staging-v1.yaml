# C-BWDSTG-001: Pre-allocated CPU Staging Buffer for Backward Mean-Pool Gradient (KAIZEN-061)
#
# backward_gpu_blocks and backward_nf4_gpu_blocks both allocate
# vec![0.0f32; seq_len * hidden_size] (~1.25MB) per sample for the mean-pool
# gradient before uploading to GPU. For SSC training (14K samples):
# 14K × 1.25MB ≈ 17.5GB heap churn per epoch from malloc/free cycles.
#
# Fix: Add backward_cpu_staging: Vec<f32> to GpuTrainingState, pre-allocated
# once at init to max_seq_len * hidden_size. Both backward paths reuse it.

contract: C-BWDSTG-001
title: "Pre-allocated CPU Staging Buffer for Backward Mean-Pool Gradient"
kaizen: KAIZEN-061
parent: C-GPUTRAINIT-002  # GPU training init contract
status: implemented
date: 2026-03-04

# Measured baseline (pre-KAIZEN-061)
baseline:
  alloc_per_backward: 1  # vec![0.0; seq_len * hidden_size]
  alloc_size_bytes: 1310720  # max_seq_len(128) * hidden(2560) * 4
  per_epoch_heap_churn_bytes: 18350080000  # 14K samples × 1.25MB + overhead
  affected_functions: 2  # backward_gpu_blocks + backward_nf4_gpu_blocks

# After KAIZEN-061
target:
  alloc_per_backward: 0  # Uses pre-allocated staging buffer
  alloc_size_bytes: 0  # No per-call allocation
  per_epoch_heap_churn_bytes: 0  # Zero per-epoch malloc/free
  one_time_cost_bytes: 1310720  # max_seq_len * hidden_size * 4 (1.25MB)

# API design
api:
  backward_cpu_staging_field: |
    New `backward_cpu_staging: Vec<f32>` field on GpuTrainingState.
    Sized to max_seq_len * hidden_size. Allocated once during
    init_training_state(). Cost: 1.25MB one-time (for seq=128, h=2560).
  backward_gpu_blocks: |
    Rewrites mean-pool backward to fill training_state.backward_cpu_staging
    directly instead of allocating a local vec![0.0; seq_len * h]. Upload
    via copy_from_host_at on the pre-allocated slice.
  backward_nf4_gpu_blocks: |
    Same rewrite — fills training_state.backward_cpu_staging instead of
    local allocation.

# Safety analysis
safety:
  buffer_sizing: |
    backward_cpu_staging is max_seq_len * hidden_size — sufficient for any
    seq_len <= max_seq_len. The mean-pool backward writes exactly
    seq_len * hidden_size elements. Remaining buffer space is ignored.
  no_zeroing_needed: |
    Every element is assigned (grad_pooled[j] * scale) before use.
    copy_from_host_at uploads only the [..seq_len * hidden_size] slice.
    Pre-existing buffer contents are irrelevant.
  split_borrows: |
    backward_cpu_staging and grad_upload_buf are separate struct fields.
    Rust split-borrow rules allow sequential mutable→shared access to
    different fields without &mut self conflicts.

# Preconditions
preconditions:
  - "GpuTrainingState initialized (backward_cpu_staging allocated)"
  - "seq_len <= max_seq_len"

# Postconditions
postconditions:
  - "Backward behavior identical — same gradient values, same GPU upload"
  - "Zero per-call CPU heap allocations in both backward functions"

# Invariants
invariants:
  - "backward_cpu_staging.len() == max_seq_len * hidden_size"
  - "backward_cpu_staging never reallocated after construction"
  - "Inference-only path unchanged (no GpuTrainingState)"

# Files modified
files:
  - path: entrenar/src/finetune/classify_pipeline.rs
    change: "Added backward_cpu_staging to GpuTrainingState, rewrote both backward functions"
