# Batch Training Contract v1.0.0
# THE SOURCE OF TRUTH for mini-batch training with gradient accumulation
#
# STATUS: Authoritative
# SPEC: bashrs/docs/specifications/shell-safety-inference.md Section 14
# TICKET: SSC-025 (paiml/entrenar#95)
# CONSUMERS:
#   - entrenar/src/finetune/classify_pipeline.rs (train_batch)
#   - entrenar/src/finetune/trainer.rs (ClassifyTrainer batch orchestration)
#
# ENFORCEMENT: Runtime assertions on gradient norms and loss values.

metadata:
  version: "1.0.0"
  created: "2026-02-25"
  author: "PAIML Engineering"
  description: "Mini-batch training with gradient accumulation for classification"
  registry: true
  references:
    - "shell-safety-inference.md v2.2.0 (bashrs spec, Section 14)"
    - "classification-finetune-v1.yaml (parent contract)"
    - "Goyal et al. (2017). Accurate, Large Minibatch SGD. arXiv:1706.02677"
  depends_on:
    - "classification-finetune-v1"
    - "qwen2-weight-loading-v1"

# =============================================================================
# BATCH CONFIGURATION
# =============================================================================

batch_config:
  default_batch_size: 32
  default_accumulation_steps: 1
  default_gradient_clip_norm: 1.0
  supported_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128]

# =============================================================================
# BATCH TRAINING INVARIANTS
# =============================================================================

training_invariants:
  gradient_accumulation:
    - id: F-BATCH-001
      name: "Gradient equivalence"
      description: |
        Accumulated gradients over N micro-batches produce the same parameter
        update as a single large batch of N * micro_batch_size samples
        (within floating-point tolerance).
      severity: P0
      critical: true
      tolerance: 1e-5

    - id: F-BATCH-002
      name: "Loss finite"
      description: "Average batch loss is finite (no NaN, no Inf) for all batches"
      severity: P0
      critical: true

    - id: F-BATCH-003
      name: "Gradient norm bounded"
      description: "After gradient clipping, total gradient norm <= clip_norm"
      severity: P0
      critical: true

    - id: F-BATCH-004
      name: "Batch size invariant"
      description: "Processed sample count == min(batch_size, remaining_samples)"
      severity: P1

  optimizer_interaction:
    - id: F-BATCH-005
      name: "Single optimizer step per batch"
      description: "optimizer.step() called exactly once per batch (not per sample)"
      severity: P0
      critical: true

    - id: F-BATCH-006
      name: "Gradient zeroing"
      description: "Gradients zeroed before each batch (no stale gradients)"
      severity: P0
      critical: true

    - id: F-BATCH-007
      name: "Gradient scaling"
      description: "Accumulated gradients divided by accumulation_steps before optimizer step"
      severity: P1

# =============================================================================
# MATHEMATICAL FOUNDATION
# =============================================================================

equations:
  gradient_accumulation:
    formula: |
      g_accumulated = (1/K) * sum_{k=1}^{K} g_micro_k
      where K = accumulation_steps, g_micro_k = gradient from micro-batch k
    domain: "K >= 1, each micro-batch has B/K samples"
    invariants:
      - "Equivalent to single batch of B samples (within FP tolerance)"
      - "Division by K normalizes gradient magnitude"

  gradient_clipping:
    formula: |
      if ||g|| > clip_norm:
          g = g * (clip_norm / ||g||)
      where ||g|| = sqrt(sum(g_i^2)) is L2 norm
    domain: "clip_norm > 0"
    invariants:
      - "Post-clipping: ||g|| <= clip_norm"
      - "Direction preserved: g_clipped / ||g_clipped|| == g / ||g||"

  batch_loss:
    formula: |
      L_batch = (1/B) * sum_{i=1}^{B} L(f(x_i), y_i)
      where B = batch_size, L = cross_entropy_loss
    domain: "B >= 1"
    invariants:
      - "L_batch is finite for all valid inputs"
      - "L_batch >= 0 (cross-entropy is non-negative)"

# =============================================================================
# POPPERIAN FALSIFICATION CRITERIA
# =============================================================================

falsification_tests:
  - id: FALSIFY-BATCH-001
    rule: "F-BATCH-001 (Gradient equivalence)"
    prediction: "Accumulated micro-batch gradients match single large-batch gradients"
    test: |
      #[test]
      fn falsify_batch_001_gradient_equivalence() {
          let samples = create_test_samples(8);

          // Single large batch
          let mut pipeline_a = create_test_pipeline();
          let result_a = pipeline_a.train_batch(&samples);
          let grads_a = pipeline_a.collect_gradients();

          // 4 micro-batches of 2
          let mut pipeline_b = create_test_pipeline();  // same init weights
          for chunk in samples.chunks(2) {
              pipeline_b.accumulate_gradients(chunk);
          }
          pipeline_b.apply_accumulated_gradients(4);  // divide by 4
          let grads_b = pipeline_b.collect_gradients();

          for (ga, gb) in grads_a.iter().zip(grads_b.iter()) {
              assert!((ga - gb).abs() < 1e-5,
                      "Gradient mismatch: {} vs {}", ga, gb);
          }
      }
    if_fails: "Gradient accumulation not equivalent to large-batch — normalization error"

  - id: FALSIFY-BATCH-002
    rule: "F-BATCH-002 (Loss finite)"
    prediction: "Batch loss is always finite"
    test: |
      proptest! {
          #[test]
          fn falsify_batch_002_loss_finite(
              batch_size in 1usize..=32,
              num_samples in 1usize..=100,
          ) {
              let samples = create_random_samples(num_samples);
              let mut pipeline = create_test_pipeline();
              let bs = batch_size.min(num_samples);
              let result = pipeline.train_batch(&samples[..bs]);
              prop_assert!(result.loss.is_finite(),
                           "Batch loss is not finite: {}", result.loss);
              prop_assert!(result.loss >= 0.0,
                           "Batch loss is negative: {}", result.loss);
          }
      }
    if_fails: "Loss computation produces NaN/Inf for some input combination"

  - id: FALSIFY-BATCH-003
    rule: "F-BATCH-003 (Gradient norm bounded)"
    prediction: "Post-clipping gradient norm <= clip_norm"
    test: |
      #[test]
      fn falsify_batch_003_gradient_clipping() {
          let samples = create_test_samples(16);
          let mut pipeline = create_test_pipeline_with_clip(1.0);
          pipeline.train_batch(&samples);
          let grad_norm = pipeline.gradient_norm();
          assert!(grad_norm <= 1.0 + 1e-6,
                  "Gradient norm {} exceeds clip_norm 1.0", grad_norm);
      }
    if_fails: "Gradient clipping not applied or applied incorrectly"

  - id: FALSIFY-BATCH-004
    rule: "F-BATCH-005 (Single optimizer step)"
    prediction: "Optimizer called exactly once per batch"
    test: |
      #[test]
      fn falsify_batch_004_single_optimizer_step() {
          let samples = create_test_samples(8);
          let mut pipeline = create_test_pipeline();

          let params_before = pipeline.collect_params();
          pipeline.train_batch(&samples);
          let params_after = pipeline.collect_params();

          // Params should have changed (optimizer stepped)
          let changed = params_before.iter().zip(params_after.iter())
              .any(|(a, b)| (a - b).abs() > 1e-10);
          assert!(changed, "No parameter update — optimizer not called");
      }
    if_fails: "Optimizer step not wired to batch completion"

  - id: FALSIFY-BATCH-005
    rule: "F-BATCH-006 (Gradient zeroing)"
    prediction: "No stale gradients between batches"
    test: |
      #[test]
      fn falsify_batch_005_no_stale_gradients() {
          let samples_a = create_test_samples(4);
          let samples_b = create_test_samples(4);
          let mut pipeline = create_test_pipeline();

          // Train two batches
          pipeline.train_batch(&samples_a);
          let grads_after_a = pipeline.collect_gradients();

          pipeline.train_batch(&samples_b);
          let grads_after_b = pipeline.collect_gradients();

          // Gradients should be different (if same, stale from batch A)
          let all_same = grads_after_a.iter().zip(grads_after_b.iter())
              .all(|(a, b)| (a - b).abs() < 1e-10);
          assert!(!all_same, "Gradients identical between batches — not zeroed");
      }
    if_fails: "Gradient zeroing not called before each batch"

# =============================================================================
# TOYOTA WAY PRINCIPLES
# =============================================================================

toyota_way_principles:
  jidoka: |
    "Automation with a human touch" — training halts immediately when loss becomes
    NaN or gradient norm explodes. No corrupt weight updates propagate.

  poka_yoke: |
    "Mistake-proofing" — batch_size validated at construction. Gradient clipping
    is always-on (configurable threshold, not optional). Division by accumulation_steps
    is automatic.

  genchi_genbutsu: |
    "Go and see" — gradient equivalence test proves accumulated micro-batches
    match single large batch with real forward/backward passes, not mocked gradients.

  kaizen: |
    "Continuous improvement" — batch configuration is a struct, not magic constants.
    Easy to tune batch_size and accumulation_steps as hardware changes.

# =============================================================================
# QA GATE
# =============================================================================

qa_gate:
  id: F-BATCH-GATE
  name: "Batch Training Contract"
  description: "Mini-batch training with gradient accumulation quality gate"
  checks:
    - "gradient_equivalence"
    - "loss_finite"
    - "gradient_norm_bounded"
    - "single_optimizer_step"
    - "gradient_zeroing"
  pass_criteria: "All 5 falsification tests pass"
  falsification: "Remove gradient division by accumulation_steps to break equivalence"
