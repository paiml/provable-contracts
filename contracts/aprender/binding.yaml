# Binding Registry: provable-contracts <-> aprender
#
# Maps each kernel contract equation to the aprender function that
# implements it. Used by `pv audit --binding` and `pv probar --binding`
# to generate wired property tests.
#
# Schema Fields:
#   contract        — YAML contract filename in contracts/ directory
#   equation        — Named equation within that contract
#   module_path     — Rust module path (e.g. aprender::nn::functional::softmax)
#   function        — Public function or method name
#   signature       — Rust type signature
#   status          — Implementation status (see below)
#   notes           — Additional context or known limitations
#
# Status Values:
#   implemented       — Function exists and matches contract semantics
#   partial           — Function exists but does not cover all obligations
#   not_implemented   — No public function available
#
# Kernel Class Coverage:
#   Class A (GQA+RMSNorm+SiLU+SwiGLU+RoPE): All bound
#   Class B (MHA+LayerNorm+GELU+AbsPos):     All bound
#   Class C (LayerNorm+GELU+ALiBi):           All bound
#   Class D (LayerNorm+GELU+SiLU+GQA):        All bound
#   Class E (RMSNorm+SwiGLU+GQA):             All bound
#
# Statistics:
#   Total bindings: 289
#   Implemented: 282 (97.6%)
#   Partial: 3
#   Not implemented: 4

version: "1.0.0"
