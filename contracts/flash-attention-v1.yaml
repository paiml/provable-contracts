metadata:
  version: "1.0.0"
  created: "2026-02-18"
  author: "PAIML Engineering"
  description: "Flash Attention — IO-aware exact attention with tiling"
  references:
    - "Dao et al. (2022) FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness"
    - "Dao (2023) FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning"
  depends_on: ["softmax-kernel-v1", "attention-kernel-v1"]

equations:
  flash_attention:
    formula: "FlashAttn(Q, K, V) = softmax(QK^T / √d_k) · V (computed in tiles)"
    domain: "Q ∈ ℝ^{N×d}, K ∈ ℝ^{N×d}, V ∈ ℝ^{N×d}"
    codomain: "ℝ^{N×d}"
    invariants:
      - "Output = standard attention output (exact, not approximate)"
      - "Memory usage O(N) not O(N²)"
      - "Online softmax: running max and sum across tiles"

proof_obligations:
  - type: precondition
    property: "Q, K, V finite and block size positive"
    formal: "all(is_finite(Q)) and all(is_finite(K)) and all(is_finite(V)) and block_size > 0"
    applies_to: all
  - type: postcondition
    property: "Output matches standard attention within tolerance"
    formal: "|FlashAttn(Q,K,V) - StdAttn(Q,K,V)| < ε for all elements"
    requires: "Q, K, V finite and block size positive"
    applies_to: all
  - type: frame
    property: "Q, K, V unchanged"
    formal: "input matrices Q, K, V are not modified by kernel"
    applies_to: all
  - type: subcontract
    property: "FlashAttention refines standard attention"
    formal: "pre(Attention) → pre(FlashAttention) ∧ post(FlashAttention) → post(Attention)"
    parent_contract: "attention-kernel-v1"
  - type: equivalence
    property: "Matches standard attention"
    formal: "|FlashAttn(Q,K,V) - StdAttn(Q,K,V)| < ε"
    tolerance: 1.0e-5
    applies_to: all
  - type: invariant
    property: "Online softmax correctness"
    formal: "Tiled softmax = full softmax"
    applies_to: all
  - type: invariant
    property: "Tile coverage"
    formal: "All (i,j) pairs processed exactly once"
    applies_to: all
  - type: conservation
    property: "Attention weight conservation"
    formal: "Each output row is weighted mean of V rows"
    applies_to: all

subcontract:
  parent_contract: "attention-kernel-v1"
  relationship: "FlashAttention is an IO-aware tiled implementation of standard attention"
  equivalence: "|FlashAttn(Q,K,V) - StdAttn(Q,K,V)| < ε"

kernel_structure:
  phases:
    - name: outer_loop
      description: "Iterate over query tiles (blocks of rows)"
      invariant: "All query rows covered"
    - name: inner_loop
      description: "Iterate over key/value tiles"
      invariant: "All KV pairs scored against current Q tile"
    - name: online_softmax
      description: "Update running max and sum for numerically stable softmax"
      invariant: "Running max >= all seen scores"
    - name: accumulate
      description: "Rescale and accumulate output tile"
      invariant: "Rescaling preserves running normalization"

falsification_tests:
  - id: FALSIFY-FA-001
    rule: "Equivalence to standard attention"
    prediction: "|flash_attn(Q,K,V) - std_attn(Q,K,V)| < 1e-5"
    test: "proptest with small random matrices"
    if_fails: "Online softmax rescaling error"
  - id: FALSIFY-FA-002
    rule: "Online softmax"
    prediction: "Tiled softmax matches full softmax"
    test: "proptest comparing tiled vs full softmax"
    if_fails: "Max tracking across tiles incorrect"
  - id: FALSIFY-FA-003
    rule: "Weight normalization"
    prediction: "Flash attention weight rows sum to 1.0"
    test: "proptest checking implicit weight sums"
    if_fails: "Rescaling factor error in tile accumulation"
  - id: FALSIFY-FA-004
    rule: "Single tile"
    prediction: "When N ≤ tile_size, matches standard attention exactly"
    test: "direct test with small inputs"
    if_fails: "Edge case in tile loop bounds"

  - id: FALSIFY-FA-005
    rule: "Precondition violation"
    prediction: "kernel panics or returns Err on invalid input"
    test: "proptest with invalid inputs (NaN, Inf, block_size = 0)"
    if_fails: "Missing input validation"
  - id: FALSIFY-FA-006
    rule: "Frame condition"
    prediction: "Q, K, V unchanged after kernel call"
    test: "proptest: clone inputs, call kernel, assert unchanged"
    if_fails: "Kernel corrupts input buffer"
  - id: FALSIFY-FA-007
    rule: "Postcondition - output shape"
    prediction: "Output matches standard attention within tolerance"
    test: "proptest: random valid inputs, verify output matches standard attention"
    if_fails: "Output allocation mismatch"

  - id: FALSIFY-FA-008
    rule: "Subcontract - FlashAttention refines Attention"
    prediction: "Any input accepted by standard Attention is also accepted by FlashAttention"
    test: "proptest: random Q,K,V valid for standard attention, verify FlashAttention accepts"
    if_fails: "FlashAttention strengthens precondition (rejects inputs standard accepts)"

kani_harnesses:
  - id: KANI-FA-001
    obligation: FA-EQ-001
    property: "Online softmax matches full softmax for 2 tiles"
    bound: 4
    strategy: stub_float
    harness: verify_online_softmax_2tiles

qa_gate:
  id: F-FA-001
  name: "Flash Attention Contract"
  checks:
    - "equivalence"
    - "online_softmax"
    - "weight_normalization"
  pass_criteria: "All 8 falsification tests pass"
  falsification: "Skip rescaling step in tile accumulation"

simd_dispatch:
  flash_attention:
    scalar: flash_attention_scalar
    avx2: flash_attention_avx2
    ptx: flash_attention_ptx
