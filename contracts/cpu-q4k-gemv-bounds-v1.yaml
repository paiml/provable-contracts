metadata:
  version: "1.0.0"
  created: "2026-03-22"
  author: "PAIML Engineering"
  description: "PMAT-313: Bounds safety for CPU Q4K GEMV raw pointer dispatch"
  references:
    - "realizar src/quantize/q4k_dot_ggml_style.rs — ggml_style_q4k_q8k_dot_avx2_raw"
    - "realizar src/quantize/q5k_q6k_matvec.rs — lean dispatch with raw pointers"
    - "PMAT-306/308: unsafe raw pointer arithmetic eliminates bounds checks"
  depends_on:
    - "cpu-q4k-activation-quant-v1.yaml"

equations:
  pointer_arithmetic:
    formula: |
      For row r in 0..out_dim:
        weight_ptr(r) = base + r * bytes_per_row
        max_access = weight_ptr(r) + 143  (last byte of SB header + qs)
      Safety: max_access < base + weight_data.len()
    domain: "Q4K weight buffer pointer arithmetic"

  q8k_indexing:
    formula: |
      For super-block sb in 0..num_sb:
        q8_offset = sb * 256
        max_q8_access = q8_offset + 255
      Safety: max_q8_access < q8k_quants.len()
    domain: "Q8K activation buffer indexing"

proof_obligations:
  - type: precondition
    property: "Weight data is large enough for all rows"
    formal: "weight_data.len() >= out_dim * bytes_per_row"
  - type: precondition
    property: "Q8K scales buffer covers all super-blocks"
    formal: "q8k_scales.len() >= num_super_blocks"
  - type: precondition
    property: "Q8K quants buffer covers all activation values"
    formal: "q8k_quants.len() >= padded_in_dim"
  - type: precondition
    property: "Output buffer is large enough"
    formal: "output.len() >= out_dim"
  - type: precondition
    property: "Bsums buffer covers all sub-blocks"
    formal: "q8k_bsums.len() >= num_super_blocks * 16"
  - type: postcondition
    property: "All output values are finite"
    formal: "output[0..out_dim].iter().all(|x| x.is_finite())"
  - type: postcondition
    property: "No out-of-bounds memory access during dot product"
    formal: "for each row in 0..out_dim: weight_ptr + row * bytes_per_row + 143 < weight_end"
  - type: frame
    property: "Inner loop accesses within Q8K bounds"
    formal: "for each sb in 0..num_sb: q8_ptr + sb * 256 + 255 < q8_end"

kani_harnesses:
  - id: KANI-GEMV-001
    obligation: PRE-GEMV-001
    property: "Weight buffer bounds verified for all valid dimensions"
    bound: 4
    strategy: stub_float
    solver: cadical
    harness: verify_weight_bounds

  - id: KANI-GEMV-002
    obligation: POST-GEMV-002
    property: "No OOB in raw pointer inner loop"
    bound: 4
    strategy: stub_float
    solver: cadical
    harness: verify_inner_loop_bounds

falsification_tests:
  - id: FALSIFY-GEMV-001
    rule: "Raw pointer path produces identical results to safe path"
    prediction: "max_abs_diff(raw_output, safe_output) < 1e-4"
    test: "Run both paths on Qwen 1.5B layer 0 Q projection"
    if_fails: "Raw pointer arithmetic has an off-by-one error"
  - id: FALSIFY-GEMV-002
    rule: "Weight buffer bounds"
    prediction: "No panic for all valid out_dim/in_dim combinations"
    if_fails: "Weight pointer exceeds allocation"
  - id: FALSIFY-GEMV-003
    rule: "Q8K scales bounds"
    prediction: "No OOB access on scales buffer"
    if_fails: "Scales index exceeds buffer length"
  - id: FALSIFY-GEMV-004
    rule: "Q8K quants bounds"
    prediction: "No OOB access on quants buffer"
    if_fails: "Quants index exceeds buffer length"
  - id: FALSIFY-GEMV-005
    rule: "Output buffer bounds"
    prediction: "All output indices within allocation"
    if_fails: "Output write past end of buffer"
  - id: FALSIFY-GEMV-006
    rule: "Bsums buffer bounds"
    prediction: "Bsums index stays within allocation"
    if_fails: "Bsums read past end"
  - id: FALSIFY-GEMV-007
    rule: "Output finiteness"
    prediction: "All outputs are finite f32 values"
    if_fails: "NaN/Inf produced by dot product accumulation"
  - id: FALSIFY-GEMV-008
    rule: "Frame condition"
    prediction: "Input buffers unchanged after GEMV"
    if_fails: "Kernel corrupts input weight or activation data"
