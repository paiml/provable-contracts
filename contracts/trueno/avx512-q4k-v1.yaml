metadata:
  version: 1.0.0
  created: '2026-04-05'
  author: PAIML Engineering
  description: AVX-512 Q4K GEMV dequant — 16-element-wide fused dequant+dot
  registry: true
  references:
  - '[46] Frantar et al. GPTQ (arXiv:2210.17323) — 4-bit quantization pattern'
  - '[47] Tseng et al. QuIP# (arXiv:2402.04396) — AVX-512 VBMI2 nibble extract'
  - 'PMAT-037: Q4K AVX2 baseline 79 GFLOPS, target 1.5-2x with AVX-512'

microkernel:
- id: C-AVX512-Q4K-001
  name: 16-element AVX-512 dequant+FMA per iteration
  description: |
    Each iteration processes 16 Q4K nibbles:
    1. _mm_loadu_si128: load 16 packed bytes (contains 16 low or high nibbles)
    2. _mm512_cvtepu8_epi32: zero-extend 16 bytes to 16 i32
    3. _mm512_and_si512 / _mm512_srli_epi32: extract low/high nibble
    4. _mm512_cvtepi32_ps: convert to f32
    5. _mm512_fmsub_ps: dequant (d*scale*q - dmin*min)
    6. _mm512_fmadd_ps: accumulate with input vector
    Per super-block (256 elements, 4 chunks): 4×(2+2) = 16 FMAs vs AVX2's 32.
  severity: P0
  critical: true
  verification: Q4K correctness tests (53 tests)

- id: C-AVX512-Q4K-002
  name: Dispatch guard + AVX2 fallback
  description: |
    Runtime dispatch in matmul_q4k_f32_dispatch checks avx512f before avx2.
    Falls back to existing AVX2 path if AVX-512 not available.
  severity: P0
  critical: true

falsification_tests:
- id: FT-AVX512-Q4K-001
  rule: AVX-512 Q4K matches AVX2 numerically
  prediction: All 53 Q4K tests pass with AVX-512 path
  test: cargo test --lib -- backends::q4k
  if_fails: Nibble extraction or dequant bug in zmm path

- id: FT-AVX512-Q4K-002
  rule: AVX-512 Q4K throughput > AVX2
  prediction: 4096x4096 Q4K GEMV improves from 79 to >110 GFLOPS
  test: benchmark_matrix_suite Q4K section
  if_fails: Register spill or cache issue in wider path

equations:
  dequant:
    formula: "value = d * scale * q4_nibble - dmin * min"
    preconditions:
    - "d, dmin from f16 header"
    - "scale, min from 6-bit packed scales"
    - "q4_nibble in [0, 15]"

qa_gate:
  id: F-AVX512-Q4K-001
  name: avx512-q4k-v1 Contract
  checks:
  - validation
  - falsification
