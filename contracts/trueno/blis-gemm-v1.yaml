metadata:
  version: 1.0.0
  created: '2026-04-05'
  author: PAIML Engineering
  description: >
    BLIS GEMM contract — matrix multiplication correctness across dispatch
    paths (scalar, AVX2 8x6, AVX-512 16x8, direct rowmajor, small strided).
    Covers compute.rs, elementwise.rs, microkernels/, packing.rs.
  references:
  - 'trueno/src/blis/compute.rs — gemm_blis(), gemm_direct_rowmajor(), gemm_small_strided_avx2()'
  - 'trueno/src/blis/elementwise.rs — add/sub/mul/silu/gelu AVX2/AVX-512'
  - 'trueno/src/blis/norms.rs — rms_norm_avx2(), layer_norm_avx2()'
  - 'trueno/src/blis/softmax.rs — softmax_avx2()'
  - 'trueno/src/blis/gemv.rs — gemv_avx2(), gemv_tiled_avx2()'
  - 'Van Zee & Van de Geijn (2015). BLIS: A Framework for Rapidly Instantiating BLAS Functionality'
  depends_on:
  - avx512-blis-v1

equations:
  gemm_correctness:
    formula: |
      gemm_blis(m, n, k, a, b, c): (usize, usize, usize, &[f32], &[f32], &mut [f32]) -> Result
        Postcondition: c[i][j] = sum(a[i][p] * b[p][j]) for p in 0..k
        Must match scalar reference implementation within f32 epsilon
    invariants:
    - Output matches gemm_reference within 1e-4 relative error
    - Works for all m,n,k > 0 including non-aligned dimensions
    - AVX2 and AVX-512 paths produce same result as scalar

  elementwise_parity:
    formula: |
      For each op in {add, sub, mul, silu, gelu}:
        op_avx2(a, b) == op_scalar(a, b) within f32 epsilon
        op_avx512(a, b) == op_scalar(a, b) within f32 epsilon
    invariants:
    - All SIMD paths match scalar reference
    - Non-aligned lengths handled correctly (remainder elements)

  norm_correctness:
    formula: |
      rms_norm(x, w, eps) = w * x / sqrt(mean(x^2) + eps)
      layer_norm(x, w, b, eps) = w * (x - mean) / sqrt(var + eps) + b
    invariants:
    - Output is finite (no NaN/Inf)
    - AVX2 path matches scalar within 1e-5

  gemv_correctness:
    formula: |
      gemv(a, x, y): (Matrix, Vector, &mut Vector)
        y[i] = sum(a[i][j] * x[j]) for j in 0..cols
    invariants:
    - Output matches scalar reference within 1e-4
    - Works for non-aligned dimensions

falsification_tests:
- id: FALSIFY-BLIS-001
  rule: gemm_correctness
  prediction: gemm_blis matches gemm_reference for various sizes
- id: FALSIFY-BLIS-002
  rule: gemm_correctness
  prediction: Non-aligned dimensions (e.g., 7x13x5) produce correct output
- id: FALSIFY-BLIS-003
  rule: elementwise_parity
  prediction: SiLU AVX2 matches scalar
- id: FALSIFY-BLIS-004
  rule: norm_correctness
  prediction: RMS norm output is finite and correct
- id: FALSIFY-BLIS-005
  rule: gemv_correctness
  prediction: GEMV matches scalar for non-aligned sizes
- id: FALSIFY-BLIS-006
  rule: gemm_correctness
  prediction: gemm_direct_rowmajor matches reference
- id: FALSIFY-BLIS-007
  rule: elementwise_parity
  prediction: add_avx512 matches scalar
- id: FALSIFY-BLIS-008
  rule: norm_correctness
  prediction: layer_norm AVX2 matches scalar
