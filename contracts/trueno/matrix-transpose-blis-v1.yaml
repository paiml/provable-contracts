---
# Contract: Matrix::transpose() BLIS AVX2 Delegation (KAIZEN-040)
# Wires crate::blis::transpose (AVX2 8×8 micro-kernel) into Matrix::transpose().
#
# Five-Whys:
#   Why 1: Matrix::transpose() underperforms at attention shapes (2048×128)
#   Why 2: Uses scalar 32×32 block iteration — no SIMD
#   Why 3: crate::blis::transpose exists with AVX2 8×8 kernel but is not called
#   Why 4: Matrix::transpose() was written before BLIS transpose module existed
#   Why 5: No audit pass to wire new BLIS kernels into Matrix API

contract: matrix-transpose-blis-v1
version: "1.0.0"
status: implemented
kaizen: "040"

invariants:
  - id: C-TRANSPOSE-001
    description: "Matrix::transpose() delegates to crate::blis::transpose for AVX2 acceleration"
    preconditions:
      - "self.data.len() == self.rows * self.cols"
    postconditions:
      - "result[j, i] == self[i, j] for all (i, j)"
      - "Uses AVX2 8×8 in-register micro-kernel on x86_64 with AVX2"
      - "Falls back to scalar for WASM, non-AVX2, and matrices < 64 elements"
      - "Backend field preserved in result matrix"
    invariants:
      - "Output dimensions: result.rows == self.cols, result.cols == self.rows"
      - "Bitwise identical to scalar transpose (no floating-point reordering)"
      - "BLIS transpose handles remainder edges (non-8-aligned dims) internally"
    verified_by:
      - "20 linear algebra tests passed"
      - "8 BLIS transpose tests passed"
      - "188 matrix tests passed (including property tests)"

affected_files:
  - path: "src/matrix/ops/linear/mod.rs"
    functions:
      - "Matrix::transpose: delegates to crate::blis::transpose::transpose()"
    change: |
      - Replaced scalar 32×32 block iteration with crate::blis::transpose() call
      - BLIS transpose uses AVX2 8×8 micro-kernel, 64×64 L1 tiling, prefetch
      - Shape-adaptive loop ordering for tall-skinny matrices
      - Fallback to scalar element-copy on dimension mismatch (unreachable by construction)

performance_note: |
  For attention-shaped transpose (2048×128, Qwen3-4B):
  - Before: scalar element copy, 32×32 blocks, no SIMD
  - After: AVX2 8-wide loads/stores, 3-phase shuffle/permute, L1-resident tiling
  - AVX2 processes 8×8 = 64 elements per micro-kernel invocation
  - Shape-adaptive: tall-skinny (rows ≥ 4×cols) uses sequential-write loop order
