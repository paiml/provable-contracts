metadata:
  version: 1.0.0
  description: Generic builder-pattern contract — common Rust API pattern
  references:
  - 'Rust API Guidelines: https://rust-lang.github.io/api-guidelines/'
equations:
  builder_pattern:
    formula: builder-pattern follows standard Rust conventions
    invariants:
    - Type safety preserved
    - No panics on valid input
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Builder_Pattern
proof_obligations:
- type: invariant
  property: builder-pattern correctness
falsification_tests:
- id: FALSIFY-GEN-001
  rule: builder-pattern contract
  prediction: Function follows builder-pattern pattern
  if_fails: Implementation deviates from pattern
kani_harnesses:
- id: KANI-GEN-001
  obligation: builder-pattern correctness
  bound: 8
  strategy: bounded_int
  solver: cadical
