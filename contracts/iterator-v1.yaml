metadata:
  version: "1.0.0"
  description: "Generic iterator contract — common Rust API pattern"
  references:
    - "Rust API Guidelines: https://rust-lang.github.io/api-guidelines/"

equations:
  iterator:
    formula: "iterator follows standard Rust conventions"
    invariants:
      - "Type safety preserved"
      - "No panics on valid input"

proof_obligations:
  - type: invariant
    property: "iterator correctness"

falsification_tests:
  - id: FALSIFY-GEN-001
    rule: "iterator contract"
    prediction: "Function follows iterator pattern"
    if_fails: "Implementation deviates from pattern"

kani_harnesses:
  - id: KANI-GEN-001
    obligation: "iterator correctness"
    bound: 8
    strategy: bounded_int
    solver: cadical
