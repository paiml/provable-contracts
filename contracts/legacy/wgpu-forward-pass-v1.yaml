name: wgpu-forward-pass-v1
version: 3.0.0
equations:
  rmsnorm_correctness:
    description: WGSL RMSNorm within 1e-5 of CPU
    measurement: 4.77e-7 (PMAT-324)
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Rmsnorm_Correctness
  gemv_dispatch:
    description: M=1 uses GEMV with Params{n,k}, M>1 uses tiled GEMM with Dims{M,K,N}
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Gemv_Dispatch
  gemv_params_safety:
    description: GEMV params.n must equal output dimension, not batch size m
    invariant: params[0] == output_dim when m == 1
    finding: 'PMAT-346: params.n was m=1, only row 0 computed'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Gemv_Params_Safety
  buffer_size_safety:
    description: Intermediate buffers must accommodate max usage across all passes
    invariant: attn_out_buf.size >= max(hidden_dim, intermediate_dim)
    finding: 'PMAT-346: attn_out_buf=1536 but SiLU writes 8960'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Buffer_Size_Safety
  weight_transpose:
    description: Matmul shader expects B in [K,N] layout; upload_weight_transposed converts [N,K]
    finding: 'PMAT-347: LM head [vocab,hidden] transposed to [hidden,vocab] at init'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Weight_Transpose
  dequant_correctness:
    description: Q4K->F32 dequant preserves semantics
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Dequant_Correctness
  gpu_bias_rope_order:
    description: Bias must be applied BEFORE RoPE (they don't commute)
    invariant: 'forward_layer: GEMV → bias_add → RoPE → attention'
    finding: 'PMAT-358: Implemented on GPU. GEMV → bias_add → RoPE in same encoder.'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Gpu_Bias_Rope_Order
  gpu_attention:
    description: 'Single-submit: attention runs on GPU with KV cache, no Q/K/V readback'
    invariant: forward_layer uses 1 submit (was 2). KV cache GPU-resident.
    finding: 'PMAT-361: WGSL attention shader with per-head softmax + GQA.'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Gpu_Attention
  q4k_fused_gemv:
    description: Fused Q4K dequant+GEMV on GPU — 4× bandwidth vs F32 GEMV
    finding: 'PMAT-365: Working. 168 Q4K weights, 625.5 MB (10x vs F32). Scale extraction fixed.'
    preconditions:
    - '!input.is_empty()'
    lean_theorem: Theorems.Q4K_Fused_Gemv
postconditions:
- name: performance_target
  threshold: 25.0
  unit: tok/s
  measurement: 0.72 (PMAT-358, W5700X with GPU bias+RoPE)
qa_gate:
  id: F-WFPV-001
  name: wgpu-forward-pass-v1 Contract
  description: Quality gate for wgpu-forward-pass-v1
  checks:
  - validation
  - falsification
