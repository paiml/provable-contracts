# Binding Registry: provable-contracts <-> realizar
#
# Maps kernel contract equations to realizar inference engine functions.
# These bindings were extracted from aprender/binding.yaml where
# realizar:: module paths were used as the implementation target.
#
# Statistics:
#   Total bindings: 23
#   Implemented: 23 (100%)
#   Partial: 0
#   Not implemented: 0
#
# Refs: paiml/realizar#139, paiml/provable-contracts#11

version: "1.0.0"
target_crate: realizar

bindings:
  # ── Quantized Compute ────────────────────────────────────────
  - contract: matmul-kernel-v1.yaml
    equation: quantized_dot
    module_path: "realizar::quantize::fused_k"
    function: fused_q4k_dot
    signature: "fn fused_q4k_dot(q4k_data: &[u8], activations: &[f32]) -> Result<f32>"
    status: implemented
    notes: "Scalar, AVX2, AVX-512 VNNI variants; also Q6K, Q8_0"

  # ── Flash Attention ──────────────────────────────────────────
  - contract: flash-attention-v1.yaml
