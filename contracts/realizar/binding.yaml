# Binding Registry: provable-contracts <-> realizar
#
# Maps kernel contract equations to realizar inference engine functions.
# These bindings were extracted from aprender/binding.yaml where
# realizar:: module paths were used as the implementation target.
#
# Statistics:
#   Total bindings: 33
#   Implemented: 27 (82%)
#   Partial: 0
#   Not implemented: 6 (PMAT-051/052/053 — paged KV + continuous batching)
#
# Refs: paiml/realizar#139, paiml/provable-contracts#11

version: "1.0.0"
target_crate: realizar

