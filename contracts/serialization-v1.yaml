metadata:
  version: "1.0.0"
  description: "Generic serialization contract — common Rust API pattern"
  references:
    - "Rust API Guidelines: https://rust-lang.github.io/api-guidelines/"

equations:
  serialization:
    formula: "serialization follows standard Rust conventions"
    invariants:
      - "Type safety preserved"
      - "No panics on valid input"

proof_obligations:
  - type: invariant
    property: "serialization correctness"

falsification_tests:
  - id: FALSIFY-GEN-001
    rule: "serialization contract"
    prediction: "Function follows serialization pattern"
    if_fails: "Implementation deviates from pattern"

kani_harnesses:
  - id: KANI-GEN-001
    obligation: "serialization correctness"
    bound: 8
    strategy: bounded_int
    solver: cadical
