metadata:
  version: "1.0.0"
  created: "2026-03-22"
  author: "PAIML Engineering"
  description: "GPU context health — FP8 warmup guard for Blackwell (sm_121+) preventing CUDA_ERROR_ILLEGAL_ADDRESS"
  references:
    - "GH-542: 32B batch inference crashes on Blackwell sm_121"
    - "GH-480: Blackwell sm_121 PTX JIT backward branch patching"

equations:
  fp8_architecture_guard:
    formula: "fp8_enabled = (cc >= 89) ∧ (cc < 100)"
    domain: "cc = CUDA compute capability (integer)"
    codomain: "fp8_enabled ∈ {true, false}"
    invariants:
      - "cc < 89 → fp8_enabled = false (pre-Ada)"
      - "89 ≤ cc < 100 → fp8_enabled = true (Ada/Hopper)"
      - "cc ≥ 100 → fp8_enabled = false (Blackwell+)"
  context_health:
    formula: "healthy = (post_warmup_status == CUDA_SUCCESS)"
    domain: "post_warmup_status after FP8 warmup attempt"
    invariants:
      - "fp8_enabled = false → context healthy (no warmup attempted)"
      - "fp8_enabled = true ∧ warmup fails → context destroyed and recreated"

proof_obligations:
  - type: precondition
    property: "Compute capability is a valid positive integer"
    formal: "cc > 0 ∧ cc ∈ ℕ"
  - type: invariant
    property: "FP8 disabled on Blackwell"
    formal: "∀ cc ≥ 100: fp8_enabled(cc) = false"
  - type: invariant
    property: "FP8 warmup is no-op on incompatible hardware"
    formal: "cc ≥ 100 → warmup_fp8_cache(cc) = NoOp"
  - type: postcondition
    property: "Context remains healthy after guard check"
    formal: "healthy(context) = true after fp8_architecture_guard"
    requires: "GPU-CTX-PRE-001"
  - type: frame
    property: "FP8 guard does not modify CUDA context state when disabled"
    formal: "cc ≥ 100 → preserves(context)"

falsification_tests:
  - id: FALSIFY-GCH-001
    rule: "FP8 disabled for Blackwell"
    prediction: "detect_fp8_prefill(cc) = false for cc in {100, 110, 120, 121, 130}"
    test: "deterministic test with known compute capabilities"
    if_fails: "Missing upper bound in FP8 detection (cc >= 89 without < 100)"
  - id: FALSIFY-GCH-002
    rule: "FP8 warmup no-op"
    prediction: "warmup_fp8_cache(cc=121) performs no GPU work"
    test: "mock CUDA calls, verify no cuBLASLt FP8 GEMM dispatched"
    if_fails: "Warmup path not guarded by architecture check"
  - id: FALSIFY-GCH-003
    rule: "Ada/Hopper FP8 still works"
    prediction: "detect_fp8_prefill(cc) = true for cc in {89, 90}"
    test: "deterministic test"
    if_fails: "Guard too aggressive — blocks valid FP8 hardware"
  - id: FALSIFY-GCH-004
    rule: "Frame condition"
    prediction: "CUDA context state unchanged when fp8_enabled = false"
    test: "snapshot context API version before/after guard, assert equal"
    if_fails: "Guard modifies context even when FP8 disabled"
  - id: FALSIFY-GCH-005
    rule: "Postcondition"
    prediction: "Context healthy after running architecture guard on any cc"
    test: "proptest: random cc values, verify context health after guard"
    if_fails: "Guard leaves context in poisoned state"

kani_harnesses:
  - id: KANI-GCH-001
    obligation: "FP8 disabled on Blackwell"
    property: "For all cc >= 100, fp8_enabled = false"
    bound: 256
    strategy: bounded_int
    solver: cadical
    harness: verify_fp8_guard

qa_gate:
  id: F-GCH-001
  name: "GPU Context Health"
  description: "FP8 Blackwell guard quality gate"
  checks:
    - "fp8_disabled_blackwell"
    - "warmup_noop"
    - "ada_hopper_works"
  pass_criteria: "All 5 falsification tests pass + Kani harness verifies"
  falsification: "Remove cc < 100 guard to re-enable FP8 on Blackwell"
