metadata:
  version: "1.0.0"
  created: "2026-03-22"
  updated: "2026-03-22"
  author: "PAIML Engineering"
  description: "GPU context health contract — ensures FP8 warmup does not poison CUDA context on incompatible architectures (Blackwell sm_121+). Prevents CUDA_ERROR_ILLEGAL_ADDRESS from propagating."
  references:
    - "GH-542: 32B batch inference crashes on Blackwell sm_121"
    - "GH-480: Blackwell sm_121 PTX JIT backward branch patching"
    - "realizar src/cuda/gpu_profile.rs — detect_fp8_prefill()"
    - "realizar src/cuda/executor/layers/cublas_prefill/attention.rs — warmup_fp8_cache()"

equations:
  fp8_architecture_guard:
    formula: "fp8_enabled = (cc >= 89) && (cc < 100)"
    domain: "cc = CUDA compute capability (integer)"
    codomain: "fp8_enabled in {true, false}"
    invariants:
      - "cc < 89 implies fp8_enabled = false (pre-Ada)"
      - "cc >= 89 && cc < 100 implies fp8_enabled = true (Ada/Hopper)"
      - "cc >= 100 implies fp8_enabled = false (Blackwell+, incompatible FP8 E4M3)"
    notes: "Blackwell sm_121 has cc=121 which passes cc >= 89 but FP8 E4M3 cuBLASLt kernels are Ada/Hopper-specific"

  context_health:
    formula: "healthy = (post_warmup_status == CUDA_SUCCESS)"
    domain: "post_warmup_status = cuCtxGetApiVersion return code after FP8 warmup attempt"
    invariants:
      - "If fp8_enabled = false, context_health is trivially true (no warmup attempted)"
      - "If fp8_enabled = true and warmup fails, context MUST be destroyed and recreated"
      - "A poisoned context (CUDA_ERROR_ILLEGAL_ADDRESS) MUST NOT be reused for inference"

proof_obligations:
  - id: PO-GPU-CTX-001
    description: "FP8 is disabled on Blackwell (cc >= 100)"
    equation: fp8_architecture_guard
    property: "For all cc >= 100: fp8_enabled = false"
    level: "L2 (runtime assertion)"
    implementation: "gpu_profile.rs:detect_fp8_prefill() returns false when cc >= 100"

  - id: PO-GPU-CTX-002
    description: "FP8 warmup cannot poison context on incompatible hardware"
    equation: context_health
    property: "warmup_fp8_cache() is a no-op when cc >= 100"
    level: "L2 (runtime assertion)"
    implementation: "attention.rs:warmup_fp8_cache() returns early when cc < 89 || cc >= 100"

  - id: PO-GPU-CTX-003
    description: "FP8 dispatch guard prevents runtime FP8 on Blackwell"
    equation: fp8_architecture_guard
    property: "cublas_prefill_gemm() never dispatches FP8 path when cc >= 100"
    level: "L2 (runtime assertion)"
    implementation: "gemm.rs:cublas_prefill_gemm() checks cc < 100 before FP8 dispatch"

falsification_tests:
  - id: FT-GPU-CTX-001
    target: PO-GPU-CTX-001
    description: "Verify FP8 disabled for Blackwell compute capabilities"
    test: |
      for cc in [100, 110, 120, 121, 130]:
          assert detect_fp8_prefill(cc) == false
          assert detect_fp8_decode(cc) == false
    expected: "All assertions pass — FP8 never enabled for cc >= 100"

  - id: FT-GPU-CTX-002
    target: PO-GPU-CTX-002
    description: "Verify FP8 warmup is no-op on Blackwell"
    test: |
      # Set cc = 121, call warmup_fp8_cache()
      # Verify: no cuBLASLt FP8 GEMM calls, no CUDA errors
      assert warmup_fp8_cache(cc=121) == NoOp
    expected: "warmup_fp8_cache returns immediately without GPU work"

  - id: FT-GPU-CTX-003
    target: PO-GPU-CTX-003
    description: "Verify Ada/Hopper FP8 still works"
    test: |
      for cc in [89, 90]:
          assert detect_fp8_prefill(cc) == true
          assert detect_fp8_decode(cc) == true
    expected: "FP8 enabled for Ada (89) and Hopper (90) architectures"

five_whys:
  symptom: "32B batch inference crashes with CUDA_ERROR_ILLEGAL_ADDRESS on Blackwell sm_121"
  analysis:
    - why: "Why does 32B GPU batch fail?"
      answer: "generate_gpu_resident FAILED: Prefill workspace init failed: CUDA_ERROR_ILLEGAL_ADDRESS"
    - why: "Why ILLEGAL_ADDRESS?"
      answer: "FP8 cache warmup writes to invalid memory on sm_121"
    - why: "Why does FP8 fail on sm_121?"
      answer: "FP8 E4M3 cuBLASLt kernels are Ada/Hopper-specific, not Blackwell-compatible"
    - why: "Why is FP8 tried on Blackwell?"
      answer: "detect_fp8_prefill() used cc >= 89 without upper bound"
    - why: "Why no upper bound?"
      answer: "Blackwell didn't exist when FP8 detection was written — assumed cc >= 89 means FP8-capable"
  root_cause: "Missing architecture upper bound in FP8 auto-detection"
  fix: "Changed to cc >= 89 && cc < 100 in gpu_profile.rs, attention.rs, gemm.rs (commit a4bcd908)"
